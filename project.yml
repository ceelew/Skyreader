name: BlueskyReader
options:
  bundleIdPrefix: com.coreylewis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  BlueskyReader:
    type: application
    platform: iOS
    sources:
      - path: BlueskyReader
    info:
      path: BlueskyReader/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Bluesky Reader
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        BGTaskSchedulerPermittedIdentifiers:
          - com.coreylewis.BlueskyReader.refresh
        UIBackgroundModes:
          - fetch
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreylewis.BlueskyReader
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
